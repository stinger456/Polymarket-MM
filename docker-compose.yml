version: '3.8'

services:
  bot:
    build: .
    container_name: polymarket-mm
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
      - ./config:/app/config
    restart: unless-stopped
    environment:
      - PAPER_TRADING=true
    # Uncomment for live trading:
    # command: ["python", "-m", "src.main", "--live"]

